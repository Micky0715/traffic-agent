[pytest]
# Three tiers of OCR test, kept separate on purpose (see
# src/vision/ocr_engine.py for the matching three engines):
#
#   (unmarked)   run against MockOCREngine — pure logic, instant, always in CI
#   fixture_ocr  replay a saved real PaddleOCR run — real content, still fast
#   real_ocr     live PaddleOCR inference — ~37s/image, needs model weights
#
# real_ocr is deselected by default so a plain `pytest` stays seconds, not
# minutes. Run it explicitly when the engine or its version changes:
#
#   pytest -m real_ocr
#   pytest -m "not real_ocr"      (the default, stated explicitly)
#   pytest -m ""                  (everything, including real_ocr)
addopts = -m "not real_ocr"
markers =
    real_ocr: runs live PaddleOCR inference (slow, needs paddleocr + weights)
    fixture_ocr: replays saved real-OCR fixtures from data/ocr_fixtures/
